<!DOCTYPE html>
<html lang="en">

<head>
  <meta http-equiv="refresh" content="0; url=./web-demo/index.html" />
  <title>Drop-off Saver Demo</title>
  <style>
    :root {
      --c-bg: #0c0d0f;
      --c-amber: #f5a623;
      --c-text-primary: #f0f1f3;
      --text-base: 1rem;
      --font-body: 'Space Grotesk', system-ui, sans-serif;
      --space-section: clamp(1rem, 4vh, 8rem);
    }

    body {
      background-color: var(--c-bg);
      color: var(--c-text-primary);
      font-family: var(--font-body);
      font-size: var(--text-base);
      font-weight: 400;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
      padding: var(--space-section) max(2rem, 3vw);
    }

    a {
      font-size: var(--text-base);
      color: var(--c-amber);
      opacity: 0.5;

      transition: opacity 0.3s ease;
    }

    a:hover {
      cursor: pointer;
      opacity: 1;
    }
  </style>
</head>

<body>
  <p>Redirecting to interactive demo... <a href="./web-demo/index.html">Click here if not redirected</a>.</p>
</body>

</html>
